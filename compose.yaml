# Local reproduction of the PaaS shape (Technical Architecture §42): one image,
# four process roles, one PostgreSQL. Not used in production.
#
#   docker compose up --build
#   open http://localhost:3000/up        (web)
#   open http://localhost:3001/up        (public)
x-app: &app
  build: .
  environment: &app-env
    DATABASE_URL: postgres://postgres:postgres@db:5432/aivora_ai
    APP_SECRET: local-development-only-not-a-secret
    LLM_API_KEY: ${LLM_API_KEY:-}
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    # pgvector is bundled but not enabled; PostgreSQL alone is the requirement.
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  web:
    <<: *app
    command: bin/process web
    ports:
      - "3000:80"

  public:
    <<: *app
    command: bin/process public
    ports:
      - "3001:80"
    depends_on:
      web:
        condition: service_started

  worker:
    <<: *app
    command: bin/process worker
    depends_on:
      web:
        condition: service_started

  scheduler:
    <<: *app
    command: bin/process scheduler
    depends_on:
      web:
        condition: service_started
